---
- name: Demonstrate Ansible tags
  hosts: webservers
  become: true

  tasks:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
      tags:
        - update

    - name: Install htop
      ansible.builtin.apt:
        name: htop
        state: present
      tags:
        - htop

    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: present
      tags:
        - apache

    - name: Ensure Apache is running
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      tags:
        - apache
